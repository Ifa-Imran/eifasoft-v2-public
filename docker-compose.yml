name: eifasoft-v2

services:
  app:
    image: node:22-alpine
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: G-Q0YNPGGFQ2
      ADMIN_API_KEY: Qwerty123@
      MONGODB_URI: mongodb://mongo:27017/eifasoft
      NODE_OPTIONS: "--max-old-space-size=4096"
    volumes:
      - app_data:/app
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /app/.next/BUILD_ID ]; then
          echo "==> Cloning eifasoft-v2 from GitHub..."
          apk add --no-cache git
          rm -rf /tmp/repo
          git clone --depth 1 https://github.com/Ifa-Imran/eifasoft-v2-public.git /tmp/repo
          cp -a /tmp/repo/. /app/
          rm -rf /tmp/repo
          cd /app
          echo "==> Installing dependencies..."
          npm ci --frozen-lockfile
          echo "==> Building Next.js app..."
          npm run build
          echo "==> Copying static files to standalone output..."
          cp -r .next/static .next/standalone/.next/
          echo "==> Copying public files to standalone output..."
          cp -r public .next/standalone/
          echo "==> Build complete!"
        fi
        echo "==> Starting server on port 3000..."
        cd /app/.next/standalone
        exec node server.js
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    networks:
      - kairo_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kairo-dev_kairo_network"
      - "traefik.http.routers.eifasoft.rule=Host(`eifasoft.com`) || Host(`www.eifasoft.com`)"
      - "traefik.http.routers.eifasoft.entrypoints=websecure"
      - "traefik.http.routers.eifasoft.tls.certresolver=letsencrypt"
      - "traefik.http.services.eifasoft.loadbalancer.server.port=3000"

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kairo_network

volumes:
  app_data:
  mongo_data:

networks:
  kairo_network:
    external: true
    name: kairo-dev_kairo_network
